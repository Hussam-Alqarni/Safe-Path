name: safe_path
description: >-
  Safe Path — smart school transport safety platform. NFC attendance on the bus
  and at the school gate, live bus tracking, adaptive routing, and instant
  guardian notifications.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Maps — Google Maps is the production renderer.
  google_maps_flutter: ^2.10.0

  # Expands shortened map links a guardian pastes.
  http: ^1.2.2

  # Utilities
  intl: any
  collection: ^1.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Fonts are bundled rather than fetched at runtime: the app must render
  # identically on a school's weak wi-fi and on a bus with no signal.
  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
